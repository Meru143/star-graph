name: Kaggle Star Graph Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'     # Monday 06:30 UTC (30 min after GH fetch)

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kaggle CLI
        run: pip install kaggle

      - name: Push notebook to Kaggle (triggers run)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Pushing to Kaggle..."
          kaggle kernels push -p ./kaggle/
          echo "Push complete. Kernel running."

      - name: Push to GitHub
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="meru143/star-graph-pipeline"
          echo "Waiting for $SLUG to complete..."
          KERNEL_FAILED=false
          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1)
            echo "  [$i/120] $STATUS"
            case "$STATUS" in
              *"complete"*|*"Complete"*|*"finished"*)
                echo "Kernel completed — downloading output..."
                kaggle kernels output "$SLUG" -p /tmp/kaggle-output/
                break
                ;;
              *"error"*|*"Error"*|*"failed"*|*"Failed"*)
                echo "Kernel errored — downloading output anyway..."
                kaggle kernels output "$SLUG" -p /tmp/kaggle-output/
                KERNEL_FAILED=true
                break
                ;;
            esac
            sleep 30
          done
          if [ -d /tmp/kaggle-output/star-graph/data/ ]; then
            echo "Data found — copying back"
            rsync -av /tmp/kaggle-output/star-graph/data/ data/
          else
            echo "No data output found"
          fi
          # Commit and push
          if git diff --quiet data/; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git diff --cached --stat data/
            git commit -m "chore: kaggle pipeline update $(date -u +%Y-%m-%d)"
            git push
          fi
          # Fail if kernel errored
          if [ "$KERNEL_FAILED" = "true" ]; then
            cat /tmp/kaggle-output/*.log 2>/dev/null || true
            echo "Kernel had errors — check logs above"
            exit 1
          fi