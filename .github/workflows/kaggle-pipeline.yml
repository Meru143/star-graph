name: Kaggle Star Graph Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'     # Monday 06:30 UTC (30 min after GH fetch)

jobs:
  trigger-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kaggle CLI
        run: pip install kaggle

      - name: Push notebook to Kaggle (triggers run)
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          echo "Pushing to Kaggle..."
          kaggle kernels push -p ./kaggle/
          echo "Push complete. Kernel running."

      - name: Wait for completion
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          SLUG="meru143/star-graph-pipeline"
          echo "Waiting for $SLUG to complete..."
          for i in $(seq 1 120); do
            STATUS=$(kaggle kernels status "$SLUG" 2>&1)
            echo "  [$i/120] $STATUS"
            case "$STATUS" in
              *"complete"*|*"Complete"*|*"finished"*)
                echo "Done!"
                kaggle kernels output "$SLUG" -p /tmp/kaggle-output/
                cat /tmp/kaggle-output/*.log 2>/dev/null || true
                exit 0
                ;;
              *"error"*|*"Error"*|*"failed"*|*"Failed"*)
                echo "FAILED — fetching logs..."
                kaggle kernels output "$SLUG" -p /tmp/kaggle-output/ 2>/dev/null || true
                cat /tmp/kaggle-output/*.log 2>/dev/null || true
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "TIMEOUT"
          exit 1

      - name: Copy output to data/
        # Kaggle output extracts to /tmp/kaggle-output/star-graph/data/
        run: |
          if [ -d /tmp/kaggle-output/star-graph/data/ ]; then
            echo "Copying output back..."
            rsync -av /tmp/kaggle-output/star-graph/data/ data/
          else
            echo "No data output found — skip"
          fi

      - name: Commit and push updated data
        run: |
          if git diff --quiet data/; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git diff --cached --stat data/
            git commit -m "chore: kaggle pipeline update $(date -u +%Y-%m-%d)"
            git push
          fi