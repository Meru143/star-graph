name: Weekly Star Graph Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:      # Manual trigger

permissions:
  contents: write  # Needed to commit graph updates

jobs:
  update-star-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx requests
      
      - name: Fetch starred repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api user/starred --paginate -q '.' > data/starred_raw.json
          echo "Fetched $(python3 -c "import json; print(len(json.load(open('data/starred_raw.json'))))") pages"
      
      - name: Build star graph
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/build_star_graph.py
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/star_graph.json data/star_graph.graphml data/last_starred_state.json data/enriched_repos.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to graph files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Graph updated"
          fi
      
      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/star_graph.json data/star_graph.graphml data/last_starred_state.json data/enriched_repos.json
          git commit -m "chore: weekly star graph update $(date -u +%Y-%m-%d)"
          git push
