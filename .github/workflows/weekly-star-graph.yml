name: Weekly Star Graph Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Force full re-enrichment'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  update-star-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx requests
      
      - name: Fetch starred repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data
          python3 << 'PYEOF'
          import subprocess, json, sys
          
          # Fetch all pages
          all_repos = []
          page = 1
          while True:
              result = subprocess.run([
                  'gh', 'api', f'user/starred?per_page=100&page={page}',
                  '-q', '.'
              ], capture_output=True, text=True, env={**dict(__import__('os').environ), 'GH_TOKEN': __import__('os').environ['GH_PAT']})
              
              if result.returncode != 0:
                  print(f"Error: {result.stderr}", file=sys.stderr)
                  sys.exit(1)
              
              try:
                  page_data = json.loads(result.stdout)
              except json.JSONDecodeError:
                  break
              
              if not page_data:
                  break
                  
              all_repos.extend(page_data)
              print(f"Page {page}: {len(page_data)} repos, total: {len(all_repos)}")
              page += 1
          
          with open('data/starred_raw.json', 'w') as f:
              json.dump(all_repos, f, indent=2)
          print(f"Total fetched: {len(all_repos)} repos")
          PYEOF
      
      - name: Build star graph
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/build_star_graph.py
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/star_graph.json data/star_graph.graphml data/last_starred_state.json data/enriched_repos.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to graph files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Graph updated"
          fi
      
      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/star_graph.json data/star_graph.graphml data/last_starred_state.json data/enriched_repos.json
          git commit -m "chore: weekly star graph update $(date -u +%Y-%m-%d)"
          git push

  # Deep enrichment job (runs separately, less frequently)
  deep-enrichment:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: github.event_name == 'workflow_dispatch' && inputs.force_full == true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx requests
      
      - name: Run deep enrichment
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/deep_research.py --token "$GH_TOKEN" --nvidia-key "$NVIDIA_API_KEY" --skip-cached
      
      - name: Build enhanced graph
        run: |
          python scripts/enrich_with_deep.py
      
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/star_graph_enhanced.json data/star_graph_enhanced.graphml data/deep_research.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/star_graph_enhanced.json data/star_graph_enhanced.graphml data/deep_research.json data/star_graph_*.mermaid
          git commit -m "chore: deep enrichment update $(date -u +%Y-%m-%d)"
          git push