name: Weekly Star Graph Update

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx requests numpy sentence-transformers

      - name: Fetch starred repos
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          mkdir -p data
          gh api user/starred --paginate --slurp | jq 'add' > data/starred_raw.json
          echo "Fetched $(python3 -c "import json; print(len(json.load(open('data/starred_raw.json'))))") repos"

      - name: Build base graph
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/build_star_graph.py --skip-enrich

      - name: Deep research (new repos only)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/deep_research.py --skip-cached

      - name: Build enhanced graph
        run: |
          python scripts/enrich_with_deep.py

      - name: Rebuild embeddings
        run: |
          python scripts/recommend.py --build-embeddings

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to graph files"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Graph updated"
          fi

      - name: Commit and push updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: weekly star graph update $(date -u +%Y-%m-%d)"
          git push
